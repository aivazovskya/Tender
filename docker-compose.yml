version: '3.8'

services:
  # 1. Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender_web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL environment variable is required}
      - REDIS_URL=redis://redis:6379
      - KASPI_WEBHOOK_SECRET=${KASPI_WEBHOOK_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOSZAKUP_API_TOKEN=${GOSZAKUP_API_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 2. BullMQ Background Worker for Ingestion & Scrapers
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender_worker
    restart: always
    command: ["node", "scripts/ingestion-worker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL environment variable is required}
      - REDIS_URL=redis://redis:6379
      - GOSZAKUP_API_TOKEN=${GOSZAKUP_API_TOKEN}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # 3. Standalone Telegraf Telegram Bot Service
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender_bot
    restart: always
    command: ["node", "scripts/telegram-bot.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL environment variable is required}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    depends_on:
      db:
        condition: service_healthy

  # 4. PostgreSQL Database Server
  db:
    image: postgres:16-alpine
    container_name: tender_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
      POSTGRES_DB: tender_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tender_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Redis Queue & Cache Server
  redis:
    image: redis:7-alpine
    container_name: tender_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
